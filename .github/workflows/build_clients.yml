name: Build Client Apps (Windows, Android, macOS, iOS, Linux)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    name: Build Windows MSI Installer
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: 'stable'
          cache: true

      - name: Install WiX Toolset
        shell: pwsh
        run: |
          choco install wixtoolset -y
          echo "C:\Program Files (x86)\WiX Toolset v3.11\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Test remote console input
        shell: pwsh
        run: |
          flutter pub get
          flutter test test/remote_pointer_surface_test.dart test/service_console_input_test.dart test/remote_keyboard_test.dart test/screen_mapping_test.dart
          if ($LASTEXITCODE -ne 0) { throw 'Flutter remote input tests failed' }
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          $vcvars = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          cmd /c "`"$vcvars`" && cl /nologo /std:c++17 /EHsc /DNOMINMAX windows\tests\remote_mouse_input_test.cpp /Fe:remote_mouse_input_test.exe user32.lib && remote_mouse_input_test.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Native remote mouse tests failed' }

      - name: Test credential logo transparency
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          $vcvars = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          cmd /c "`"$vcvars`" && cl /nologo /std:c++17 /EHsc /DNOMINMAX windows\tests\credential_bitmap_test.cpp /Fe:credential_bitmap_test.exe ole32.lib windowscodecs.lib gdi32.lib && credential_bitmap_test.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Credential logo transparency tests failed' }

      - name: Build Windows Application and MSI
        shell: pwsh
        run: |
          flutter pub get
          .\scripts\build_msi.ps1

      - name: Upload Windows MSI Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Ligament-2FA-Windows-MSI
          path: dist/Ligament-2FA-Windows-x64.msi

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: 'stable'
          cache: true

      - name: Build Android APK
        # Release signing is supplied as protected Gradle properties, without env.
        # The secret is one base64-encoded properties file, including the keystore.
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.gradle"
          signing_properties="$HOME/.gradle/gradle.properties"
          trap 'rm -f "$signing_properties" build/app/tmp_signing/release_from_env.keystore android/app/build/tmp_signing/release_from_env.keystore' EXIT
          printf '%s' '${{ secrets.ANDROID_SIGNING_PROPERTIES_BASE64 }}' | base64 --decode > "$signing_properties"
          if [ ! -s "$signing_properties" ]; then
            echo '::error::Configure the ANDROID_SIGNING_PROPERTIES_BASE64 repository secret for release signing.'
            exit 1
          fi
          flutter pub get
          flutter build apk --release
          apksigner=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          [ -n "$apksigner" ]
          "$apksigner" verify --verbose --print-certs build/app/outputs/flutter-apk/app-release.apk
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/Ligament-2FA.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Ligament-2FA-Android-APK
          path: dist/Ligament-2FA.apk

  build-macos:
    name: Build macOS DMG
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: 'stable'
          cache: true

      - name: Build macOS Application and DMG
        run: |
          flutter pub get
          flutter build macos --release
          chmod +x scripts/build_dmg.sh
          ./scripts/build_dmg.sh

      - name: Upload macOS DMG Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Ligament-2FA-macOS-DMG
          path: dist/Ligament-2FA-macOS.dmg

  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: 'stable'
          cache: true

      - name: Build iOS Application and IPA
        run: |
          flutter pub get
          flutter build ios --release --no-codesign
          chmod +x scripts/build_ios.sh
          ./scripts/build_ios.sh

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Ligament-2FA-iOS-IPA
          path: dist/Ligament-2FA.ipa

  build-linux:
    name: Build Linux Packages (.deb, .rpm, .tar.gz)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            liblzma-dev \
            libsecret-1-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libayatana-appindicator3-dev \
            rpm \
            dpkg-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: 'stable'
          cache: true

      - name: Build Linux Application and Packages
        run: |
          flutter pub get
          chmod +x scripts/build_linux.sh linux/packaging/install.sh
          ./scripts/build_linux.sh

      - name: Upload Linux DEB Artifact (Astra Linux, Debian, Ubuntu)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Ligament-2FA-Linux-DEB
          path: dist/Ligament-2FA-Linux-amd64.deb

      - name: Upload Linux RPM Artifact (РЕД ОС, Alt Linux, Fedora, RHEL)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Ligament-2FA-Linux-RPM
          path: dist/Ligament-2FA-Linux-x86_64.rpm

      - name: Upload Linux Tarball Artifact (Universal Portable)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Ligament-2FA-Linux-Tarball
          path: dist/Ligament-2FA-Linux-x86_64.tar.gz

  create-release:
    name: Create GitHub Release & Upload Binaries
    needs: [build-windows, build-android, build-macos, build-ios, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download all build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts

      - name: Organize release assets and compute checksums
        run: |
          mkdir -p release_assets
          find artifacts -type f \( -name "*.msi" -o -name "*.apk" -o -name "*.dmg" -o -name "*.ipa" -o -name "*.zip" -o -name "*.deb" -o -name "*.rpm" -o -name "*.tar.gz" \) -exec cp {} release_assets/ \;
          cd release_assets
          sha256sum * > SHA256SUMS.txt
          ls -la

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: release_assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
