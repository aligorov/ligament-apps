name: Check Windows Credential Provider
on:
  push:
    branches: ['codex/**']
    paths:
      - 'windows/credential_provider/**'
      - 'windows/tests/credential_bitmap_test.cpp'
      - '.github/workflows/check_credential_provider.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Test PNG transparency
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          $vcvars = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          cmd /c "`"$vcvars`" && cl /nologo /std:c++17 /EHsc /DNOMINMAX windows\tests\credential_bitmap_test.cpp /Fe:credential_bitmap_test.exe ole32.lib windowscodecs.lib gdi32.lib && credential_bitmap_test.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Credential logo transparency tests failed' }
      - name: Build credential provider
        run: |
          cmake -S windows/credential_provider -B build-cp -A x64 -DCMAKE_CXX_FLAGS=/DNOMINMAX
          if ($LASTEXITCODE -ne 0) { throw 'CMake configuration failed' }
          cmake --build build-cp --config Release
          if ($LASTEXITCODE -ne 0) { throw 'Credential provider build failed' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: LigamentCredentialProvider-x64
          path: build-cp/Release/LigamentCredentialProvider.dll
