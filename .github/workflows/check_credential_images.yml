name: Check Credential Images
on:
  push:
    branches: ['codex/**']
    paths: ['windows/credential_provider/**', 'windows/tests/credential_images_test.cpp', '.github/workflows/check_credential_images.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Configure native provider and image tests
        run: cmake -S windows/credential_provider -B build-images -A x64 -DLIGAMENT_CREDENTIAL_IMAGE_TESTS=ON
      - name: Build DLL and contract tests
        run: cmake --build build-images --config Release
      - name: Test real credential image interfaces and QR pixels
        run: ./build-images/Release/credential_images_test.exe
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: credential-image-test-results
          path: |
            build-images/Release/LigamentCredentialProvider.dll
            credential-*.png
